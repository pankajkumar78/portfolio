<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image source</title>
<!-- Source for og-image.png (1200x630). Regenerate with the command in README.md. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0f1115; color: #eceef2; font-family: "Helvetica Neue", Arial, sans-serif; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-family: Menlo, monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa1ae; }
  h1 { font-size: 92px; letter-spacing: -0.04em; line-height: 1; margin-top: 22px; font-weight: 800; }
  .sub { font-size: 36px; color: #ff6b4f; font-weight: 700; margin-top: 18px; letter-spacing: -0.01em; }
  .row { display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 700; }
  .chip { white-space: nowrap; padding: 14px 26px; border-radius: 999px; border: 2px solid #2a2f3a; background: #1b1f27; }
  .next { background: #16243d; border-color: #16243d; color: #5b9cff; }
  .arrow { color: #9aa1ae; }
  .url { margin-left: auto; font-family: Menlo, monospace; font-size: 22px; color: #9aa1ae; font-weight: 400; }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Portfolio</div>
    <h1>Pankaj Kumar</h1>
    <div class="sub">Engineering Leader · Mobile, Connected TV &amp; OTT</div>
  </div>
  <div class="row">
    <span class="chip">Mobile</span><span class="arrow">→</span>
    <span class="chip">Connected TV</span><span class="arrow">→</span>
    <span class="chip next">Automotive</span>
    <span class="url">pankajkumar78.github.io</span>
  </div>
</body>
</html>
